services:
  - type: web
    name: asd-pro-goldclass
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: ASD_PRO_DATA_DIR
        value: /var/data/asd-pro
      - key: ASD_DEV_BYPASS
        value: "1"
      - key: ASD_SECRET_KEY
        generateValue: true
      - key: ASD_ADMIN_PASSWORD
        sync: false
    disk:
      name: asd-pro-data
      mountPath: /var/data
      sizeGB: 1
