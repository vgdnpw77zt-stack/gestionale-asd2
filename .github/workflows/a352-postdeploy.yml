name: A352 verified production visual/source integrity
on:
  push:
    branches: [bodymind-a352-visible-aurora-dock-20261027]
    paths: ['.github/workflows/a352-postdeploy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-source-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SSH_KEY: ${{ secrets.BODYMIND_RAILWAY_SSH_PRIVATE_KEY }}
    steps:
      - name: Protected SSH connection
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
      - name: Verify live A352 CSS/JS actual source, backup A351, SQLite and HTTP
        shell: bash
        run: |
          set -euo pipefail
          timeout 95s ssh -T -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 bodymind-app-production.up.railway.app@ssh.railway.com 'PYTHONDONTWRITEBYTECODE=1 python3 -' <<'PY'
          import ast,hashlib,sqlite3,json,urllib.request,urllib.error
          from pathlib import Path
          src=Path('/data/top2_app/asd_app/routes_bodymind_final.py')
          old=Path('/data/release_packages/BODYMIND_A352_PREUI_A351.py')
          assert src.is_file() and not src.is_symlink()
          assert old.is_file() and not old.is_symlink()
          code=src.read_bytes()
          sha=hashlib.sha256(code).hexdigest()
          prev=hashlib.sha256(old.read_bytes()).hexdigest()
          assert sha=='0046972b866a807551a6443a884e8b705b401d145067ae4185f8c03680a1e075'
          assert prev=='f8ee6e88dc02dff83cc472016adf951f95d87a8e344b3161ebdbf870e3ae36ed'
          assert code.count(b'BODYMIND A352 VISIBLE AURORA')==1
          assert code.count(b'BODYMIND A352 VISIBLE DOCK')==1
          for key in [b'bm352-cloudstream',b'bm352-dust',b'bm352-dock-handle',b'bm352-tucked',
                      b'A352 CINEMA STRIP',b'repeating-linear-gradient',b'family-hero-video']:
              assert key in code,key
          tree=ast.parse(code.decode('utf-8'))
          assert len([x for x in ast.walk(tree) if isinstance(x,ast.FunctionDef) and x.name=='bodymind_doc'])==1
          with sqlite3.connect('file:/data/tenants/default/asd.db?mode=ro',uri=True,timeout=20) as db:
              db.execute('PRAGMA query_only=ON')
              quick=db.execute('PRAGMA quick_check').fetchone()[0]
              fk=db.execute('PRAGMA foreign_key_check').fetchall()
              counts={t:db.execute('SELECT COUNT(*) FROM "'+t+'"').fetchone()[0] for t in
                      ['tesserati','pagamenti','ricevute','quote_mensili']}
          assert quick=='ok' and not fk
          def status(path):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080'+path,timeout=12) as r:return r.status
              except urllib.error.HTTPError as e:return e.code
          checks={'health':status('/health'),'login':status('/login'),
                  'fake_album':status('/app-tesserato/A352_NOT_REAL_81818181/album')}
          assert checks=={'health':200,'login':200,'fake_album':404},checks
          print('A352_LIVE_READONLY_AUDIT_PASS '+json.dumps({
              'active_code_sha256':sha,'A351_rollback_sha256':prev,
              'source_sky_and_film_css':'present',
              'sqlite_quick_check':quick,'foreign_key_issues':0,
              'counts':counts,'http_checks':checks,
              'private_documents_touched':False,'db_modified':False
          },sort_keys=True))
          PY
      - name: Wipe transient credential
        if: always()
        shell: bash
        run: |
          if [[ -f "$HOME/.ssh/id_ed25519" ]]; then
            shred -u "$HOME/.ssh/id_ed25519" || rm -f "$HOME/.ssh/id_ed25519"
          fi
