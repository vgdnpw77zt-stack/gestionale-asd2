name: A362 read-only live source and Clean Boot audit
on:
  push:
    branches: [bodymind-a362-readonly-investigation-20261030]
    paths: ['.github/workflows/a362-readonly.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RAILWAY_SSH_KEY: ${{ secrets.BODYMIND_RAILWAY_SSH_PRIVATE_KEY }}
    steps:
      - name: Read-only audit using existing SSH access
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RAILWAY_SSH_KEY" ]]; then
            echo "::error::BLOCKED_EXISTING_SSH_KEY_UNAVAILABLE"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RAILWAY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          timeout 65s ssh -T -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 bodymind-app-production.up.railway.app@ssh.railway.com 'PYTHONDONTWRITEBYTECODE=1 python3 -' <<'PY'
          import ast, hashlib, importlib.util, json
          from pathlib import Path
          root=Path('/data/top2_app')
          spec=importlib.util.spec_from_file_location('audit_launcher','/opt/bodymind/clean_runtime_launcher.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print('A362_READONLY_CLEANBOOT',json.dumps(module.preflight(root,Path('/data/tenants/default/asd.db')),sort_keys=True))
          import base64,zlib
          for name in ('routes_bodymind_final.py','routes_iscrizione_online.py'):
              data=(root/'asd_app'/name).read_bytes()
              print('A362_SOURCE_PAYLOAD',name,base64.b64encode(zlib.compress(data)).decode())
          print('A362_NO_APPLICATION_IMPORT_NO_VOLUME_WRITES')
          PY
      - name: Remove ephemeral SSH credential
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
