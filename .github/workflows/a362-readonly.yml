name: Family balance read-only investigation
on:
  push:
    branches: [bodymind-a362-readonly-investigation-20261030]
    paths: ['.github/workflows/a362-readonly.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RAILWAY_SSH_KEY: ${{ secrets.BODYMIND_RAILWAY_SSH_PRIVATE_KEY }}
    steps:
      - name: Read only relevant ledger rows and calculation source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RAILWAY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          mkdir evidence
          timeout 60s ssh -T -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 bodymind-app-production.up.railway.app@ssh.railway.com 'PYTHONDONTWRITEBYTECODE=1 python3 -' > evidence/balance.json <<'PY'
          import sqlite3,json,datetime,ast
          from pathlib import Path
          con=sqlite3.connect('file:/data/tenants/default/asd.db?mode=ro',uri=True);con.row_factory=sqlite3.Row
          con.execute('PRAGMA query_only=ON')
          t=con.execute("SELECT id FROM tesserati WHERE upper(nome)=? AND upper(cognome)=?",('GAIA','ABATINI')).fetchall()
          assert len(t)==1
          tid=t[0]['id'];out={'today':str(datetime.date.today()),'athlete_id':tid,'tables':{}}
          allowed={'id','tesserato_id','atleta_id','mese','anno','importo','importo_previsto','importo_pagato','quota','quota_mensile','tariffa','data','data_pagamento','stato','status','tipo','causale','descrizione','pagamento_id','ricevuta_id','quota_id','sconto','esente','dovuto','pagato','residuo','attivo','corso','mensilita','periodo','created_at','updated_at'}
          for table in ('tesserati','quote_mensili','pagamenti','ricevute'):
              cols=[r[1] for r in con.execute('PRAGMA table_info("'+table+'")')]
              key='id' if table=='tesserati' else next((k for k in ('tesserato_id','atleta_id') if k in cols),None)
              keep=[x for x in cols if x in allowed]
              out['tables'][table]={'columns':cols,'rows':[]}
              if key and keep:
                  q='SELECT '+','.join('"'+x+'"' for x in keep)+' FROM "'+table+'" WHERE "'+key+'"=?'
                  out['tables'][table]['rows']=[dict(x) for x in con.execute(q,(tid,))]
          source=Path('/data/top2_app/asd_app/quote_engine.py').read_text()
          out['quote_engine_source']=source
          core=ast.parse(Path('/data/top2_app/asd_app/core.py').read_text())
          out['current_month_year_source']=next(ast.unparse(n) for n in core.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name=='current_month_year')
          con.close()
          print(json.dumps(out,ensure_ascii=False,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: family-balance-private-audit
          path: evidence/balance.json
          retention-days: 1
      - name: Remove ephemeral key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
