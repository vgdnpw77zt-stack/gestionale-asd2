name: A367 attendance corrections regression
on:
  push:
    branches: [bodymind-a367-presenze-storico-correzioni-20261105]
    paths:
      - 'bootstrap/a367_attendance_corrections.py'
      - 'tests/test_a367_attendance_corrections.py'
      - '.github/workflows/a367-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic-only correction tests
        run: python3 -m unittest discover -s tests -p 'test_a367_attendance_corrections.py' -v
