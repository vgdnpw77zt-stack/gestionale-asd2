name: A345 source-only CSS selector diagnostics
on:
  push:
    branches: [bodymind-a345-full-video-mobile-20261025]
jobs:
  inspect-public-styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract A340 video/hero selector fragments (public CSS, no private volume)
        run: |
          python - <<'PY'
          import base64,zlib,re
          from pathlib import Path
          b=Path('bootstrap/family_a340.css.zlib.base64').read_text().strip()
          css=zlib.decompress(base64.b64decode(b)).decode('utf-8')
          print('A340_CSS_LENGTH',len(css))
          blocks=re.findall(r'([^{}]+)\{([^{}]*)\}',css)
          for selector,body in blocks:
              if any(key in selector.lower() for key in ['hero','video','film','main','media','wave']):
                  print('CSS_RULE',repr(selector.strip()[:180]),repr(body.strip()[:330]))
          PY
      - name: Pin full-frame CSS and control script digests
        run: sha256sum bootstrap/family_a345_fullframe.css bootstrap/family_a345_fullframe.js
