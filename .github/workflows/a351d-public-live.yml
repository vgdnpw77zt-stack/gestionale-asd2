name: BodyMind A351d public courses — post-release WebKit QA
on:
  push:
    branches: [bodymind-site-percorsi-editorial-20261112]
    paths:
      - 'qa/a351d_public_live_webkit.py'
      - '.github/workflows/a351d-public-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Apple WebKit
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps webkit
      - name: Verify REAL online video, original production photos, captions and booking
        run: python qa/a351d_public_live_webkit.py
      - name: Retain public photographic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodymind-a351d-original-photos-production
          path: evidence/a351d-live/
          retention-days: 7
