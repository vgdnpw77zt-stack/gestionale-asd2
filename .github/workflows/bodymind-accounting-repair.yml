name: BodyMind accounting regression QA

on:
  push:
    branches:
      - bodymind-accounting-repair-20261013
  pull_request:
    branches:
      - railway-top2-production

permissions:
  contents: read

jobs:
  accounting-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax and safe accounting semantics
        run: python -m unittest discover -s tests -p 'test_bodymind_*.py' -v
