name: Mobile dock WebKit
on:
  push:
    branches: [bodymind-site-mobile-dock-20261111]
    paths: [.github/workflows/dock-qa.yml]
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright
      - run: playwright install --with-deps webkit
      - run: python qa/dock_qa.py candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dock-webkit
          path: dock-evidence/
