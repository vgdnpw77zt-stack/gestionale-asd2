name: BodyMind A293 isolated payment safety
on:
  push:
    branches:
      - bodymind-a293-payments-family-reminders-operator-20261020
    paths:
      - 'fixes/a293/**'
      - 'tests/test_a293_*.py'
      - '.github/workflows/bodymind-a293-safety.yml'
  pull_request:
    paths:
      - 'fixes/a293/**'
      - 'tests/test_a293_*.py'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test without production access
        run: |
          python -m compileall -q fixes/a293 tests/test_a293_family_payment_policy.py tests/test_a293_due_correction_policy.py tests/test_a293_admin_integration.py
          python -m pip install 'Flask>=3.0,<4.0'
          python -m unittest discover -s tests -p 'test_a293_*.py' -v
