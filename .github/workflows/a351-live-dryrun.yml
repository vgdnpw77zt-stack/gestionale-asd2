name: A351 exact live A350 source memory-only preview
on:
  push:
    branches: [bodymind-a351-aurora-stories-20261027]
    paths:
      - '.github/workflows/a351-live-dryrun.yml'
      - 'bootstrap/clean_runtime_launcher.py'
      - 'bootstrap/family_a351_sunrise.css'
      - 'bootstrap/family_a351_sunrise.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-source-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      HAS_KEY: ${{ secrets.BODYMIND_RAILWAY_SSH_PRIVATE_KEY != '' }}
      RAILWAY_SSH_KEY: ${{ secrets.BODYMIND_RAILWAY_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Authorized SSH
        shell: bash
        run: |
          [[ "$HAS_KEY" == true ]] || exit 1
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RAILWAY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
      - name: Transform deployed source in RAM only, verify business handler AST unchanged
        shell: bash
        run: |
          set -euo pipefail
          audit='import sys,tarfile,types,pathlib,hashlib,ast;bundle=tarfile.open(fileobj=sys.stdin.buffer,mode="r|");files={m.name:bundle.extractfile(m).read() for m in bundle if m.isfile()};ns={"__name__":"a351_preview_only"};exec(compile(files["bootstrap/clean_runtime_launcher.py"],"candidate.py","exec"),ns);ns["A351_CSS_PATH"]=types.SimpleNamespace(read_bytes=lambda:files["bootstrap/family_a351_sunrise.css"]);ns["A351_JS_PATH"]=types.SimpleNamespace(read_bytes=lambda:files["bootstrap/family_a351_sunrise.js"]);old=pathlib.Path("/data/top2_app/asd_app/routes_bodymind_final.py").read_bytes();print("A351_ANCHOR_COUNTS",[(k.decode(),old.count(k)) for k in (b"</style>\\n</head>",b"</body></html>",b"</body>\\n</html>",b"</html>",b"</body>")]);new,sha=ns["a351_expected_from_a350"](old);a=ast.parse(old.decode());b=ast.parse(new.decode());names=("bodymind_upload","bodymind_doc");extract=lambda t,name:[ast.dump(n,include_attributes=False) for n in ast.walk(t) if isinstance(n,ast.FunctionDef) and n.name==name];print("A351_SECURITY_FLAGS",{"ast_unchanged":all(extract(a,n)==extract(b,n) for n in names),"dock":b"BODYMIND A351 DOCK" in new,"album":b"BODYMIND A351 PRIVATE ATHLETE ALBUM" in new,"a350_links":b"bodymind-media-links-a350" in new,"hash":hashlib.sha256(old).hexdigest()==ns["A351_A350_LIVE_SHA"]});assert all(extract(a,n)==extract(b,n) for n in names),"business handler drift";assert b"BODYMIND A351 DOCK" in new;assert b"BODYMIND A351 PRIVATE ATHLETE ALBUM" in new;assert b"bodymind-media-links-a350" in new;assert hashlib.sha256(old).hexdigest()==ns["A351_A350_LIVE_SHA"];print("A351_REAL_SOURCE_MEMORY_DRYRUN_PASS");print("A351_CANDIDATE_SHA256="+sha);print("A351_LEGACY_BUSINESS_AST_UNCHANGED");print("A351_NO_LIVE_DB_OR_MEDIA_WRITES")'
          tar -cf - bootstrap/clean_runtime_launcher.py bootstrap/family_a351_sunrise.css bootstrap/family_a351_sunrise.js | timeout 90s ssh -T -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 bodymind-app-production.up.railway.app@ssh.railway.com "PYTHONDONTWRITEBYTECODE=1 python3 -c '$audit'"
      - name: Erase SSH identity
        if: always()
        run: |
          if [[ -f "$HOME/.ssh/id_ed25519" ]]; then
            shred -u "$HOME/.ssh/id_ed25519" || rm -f "$HOME/.ssh/id_ed25519"
          fi
