name: BodyMind A292 safe family portal tests
on:
  push:
    branches:
      - bodymind-a292-family-receipts-safety-20261019
  pull_request:
    paths:
      - 'fixes/a292/**'
      - 'tests/test_a292*'
permissions:
  contents: read
jobs:
  receipt-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile fixes/a292/*.py tests/test_a292_family_receipt_visibility.py
      - name: Run isolated receipt visibility tests
        run: python -m unittest discover -s tests -p 'test_a292_family_receipt_visibility.py' -v
