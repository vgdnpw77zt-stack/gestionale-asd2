name: A363 family scene static/WebKit CSS regression (no private session)
on:
  push:
    branches: [bodymind-a363-family-cinematic-webkit-20261111]
    paths:
      - '.github/workflows/a363-family-scene.yml'
      - 'bootstrap/family_a362_runtime.py'
      - 'bootstrap/family_a362_scene.css'
      - 'tests/test_a363_scene_webkit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile actual A362/A363 Python runtime
        run: python -m py_compile bootstrap/family_a362_runtime.py bootstrap/family_a362_wsgi.py
      - name: Install WebKit for geometry and motion checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps webkit
      - name: Verify iPhone 320 / 390 / 430 and tablet/desktop
        run: python tests/test_a363_scene_webkit.py
