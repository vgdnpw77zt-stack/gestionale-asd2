name: BodyMind A360 — LIVE CSS route verification
on:
  push:
    branches: [bodymind-a360-family-css-delivery-20261030]
  workflow_dispatch:
jobs:
  public-css-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - name: Verify production CSS endpoint and health without auth
        run: |
          python - <<'PY'
          import urllib.request
          url='https://app.bodymindaerialstudio.life/_bodymind_family_a360.css?v=20261030-a360'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'BodyMind-A360-Production-Smoke'})
          with urllib.request.urlopen(req, timeout=25) as response:
              css=response.read(200000).decode('utf-8','replace')
              assert response.status==200,(response.status,url)
              assert 'text/css' in response.headers.get('Content-Type','')
              assert 'no-store' in response.headers.get('Cache-Control','')
              assert 'BODYMIND A360' in css
              assert 'BODYMIND A359' in css
              assert '@keyframes bm360-cloud-flow' in css
              assert '.hero .hero-intro h1' in css
              assert 'main.main>.bm352-sky::after' in css
              print('A360 LIVE CSS PASS: status=200, content-type=text/css, no-store, both A359/A360 designs present; bytes=',len(css))
          with urllib.request.urlopen('https://app.bodymindaerialstudio.life/health',timeout=20) as response:
              text=response.read(400).decode('utf-8')
              assert response.status==200 and '"ok":true' in text,text
              print('A360 APP HEALTH PASS',text)
          PY
