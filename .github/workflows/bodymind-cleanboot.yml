name: BodyMind clean boot isolated QA
on:
  push:
    branches: [bodymind-cleanboot-a301-20261020]
  pull_request:
    paths:
      - bootstrap/**
      - Dockerfile
      - tests/**
      - .github/workflows/bodymind-cleanboot.yml
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_cleanboot_*.py' -v
