name: BodyMind clean boot isolated QA
on:
  push:
    branches: [bodymind-cleanboot-a301-20261020, bodymind-a344-boutique-editorial-20261025, bodymind-a345-full-video-mobile-20261025, bodymind-a346-luxury-ux-20261025, bodymind-a347-cinematic-overlay-20261025]
  pull_request:
    paths:
      - bootstrap/**
      - Dockerfile
      - tests/**
      - .github/workflows/bodymind-cleanboot.yml
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_cleanboot_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_a344_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_a345_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_a346_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_a347_*.py' -v

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production-style image from clean Dockerfile
        run: docker build --pull --tag bodymind-cleanboot:qa .
      - name: Validate Railway legacy-path shim is the CLEAN launcher
        run: |
          docker run --rm --entrypoint python bodymind-cleanboot:qa -c "from pathlib import Path; p=Path('/opt/bodymind-migration/migration_upload.py'); b=p.read_text(); assert 'EXPECTED_SOURCE_COUNT=209' in b; assert 'runpy.run_path' not in b; assert 'os.execvp' in b; print('CLEAN_LAUNCHER_IMAGE_OK')"
      - name: Reject historical migration scripts in the new image
        run: |
          docker run --rm --entrypoint python bodymind-cleanboot:qa -c "from pathlib import Path; p=Path('/opt/bodymind'); unexpected=[str(x) for x in p.glob('release_*.py')]; assert not unexpected, unexpected; print('NO_LEGACY_RELEASE_SCRIPTS')"
