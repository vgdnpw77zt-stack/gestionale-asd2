name: Validate ASD Pro Online package

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate online package
        run: |
          test -f ASD_PRO_GOLDCLASS_ONLINE_READY.zip
          rm -rf /tmp/asdpro
          mkdir -p /tmp/asdpro
          unzip -q ASD_PRO_GOLDCLASS_ONLINE_READY.zip -d /tmp/asdpro
          test -f /tmp/asdpro/ASD_PRO_GOLDCLASS_ONLINE_READY/app.py
          test -f /tmp/asdpro/ASD_PRO_GOLDCLASS_ONLINE_READY/wsgi.py
          test -f /tmp/asdpro/ASD_PRO_GOLDCLASS_ONLINE_READY/requirements.txt
          echo "ASD Pro Goldclass online package OK"
