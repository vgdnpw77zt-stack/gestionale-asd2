name: Deploy ASD Pro to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application package
        run: |
          rm -rf app
          mkdir app
          unzip -q ASD_PRO_GOLDCLASS_GITHUB_PAGES_FIXED.zip -d app
          test -f app/frontend/package.json
          test -f app/frontend/public/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app/frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build frontend
        working-directory: app/frontend
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          GENERATE_SOURCEMAP: false
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload built frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/frontend/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
