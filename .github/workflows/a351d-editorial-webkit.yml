name: BodyMind A351d photographic course captions - WebKit preview
on:
  push:
    branches: [bodymind-site-percorsi-editorial-20261112]
    paths:
      - 'site/static/sunrise.css'
      - 'site/templates/index.html'
      - 'qa/a351d_editorial_webkit.py'
      - '.github/workflows/a351d-editorial-webkit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flask site and Apple WebKit
        run: |
          python -m pip install -r site/requirements.txt playwright
          python -m playwright install --with-deps webkit
      - name: Start isolated public site without production data
        run: |
          set -euo pipefail
          mkdir -p /tmp/bodymind-a351d-preview
          (cd site && SITE_DATA_DIR=/tmp/bodymind-a351d-preview gunicorn --bind 127.0.0.1:8765 --workers 1 --threads 2 --timeout 60 app:app > /tmp/a351d.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8765/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/healthz
      - name: Verify original site video and non-overlapping photos and captions
        run: python qa/a351d_editorial_webkit.py
      - name: Store photographic screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodymind-a351d-course-editorial-webkit
          path: evidence/a351d/
          retention-days: 7
